<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControleÁgil - Voz & Banco de Dados</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        
        #btnGravar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 20px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
            margin-bottom: 10px;
            cursor: pointer;
        }
        #btnGravar.gravando {
            background-color: #dc3545;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 15px rgba(220, 53, 69, 0.6); }
            100% { transform: scale(1); }
        }

        .status { text-align: center; margin-top: 5px; font-style: italic; color: #666; font-size: 14px; }
        .dica { text-align: center; font-size: 12px; color: #888; margin-bottom: 15px; }
        .aviso-banco { text-align: center; font-size: 12px; color: #28a745; font-weight: bold; margin-bottom: 15px; }

        /* Estilo das Abas */
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #e9ecef;
            color: #495057;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .tab-btn.ativo {
            background-color: #007bff;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.ativo { display: block; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #f1f1f1; }
        .table-container { overflow-x: auto; }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .status-em-uso { background-color: #ffeeba; color: #856404; }
        .status-devolvido { background-color: #d4edda; color: #155724; }
        
        .btn-baixa {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-baixa:hover { background-color: #e0a800; }
        .linha-baixa td { background-color: #f8f9fa; color: #999; }
        .linha-baixa td:nth-child(3) { text-decoration: line-through; }

        .acoes-finais {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        #btnExportar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 2;
        }
        #btnLimpar {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>

    <h2>ControleÁgil</h2>

    <div class="card">
        <label>Comando de Voz</label>
        <p class="dica">Fale no formato: <b>"Nome" + pegou/retirou + "ferramenta"</b><br>(Ex: <i>"Carlos pegou uma furadeira"</i>)</p>
        <p class="aviso-banco">💾 Salvamento Automático Ativado</p>
        
        <button id="btnGravar">🎙️ Tocar para Falar</button>
        <div class="status" id="statusTexto">Aguardando...</div>
    </div>

    <!-- Navegação por Abas -->
    <div class="tab-buttons">
        <button class="tab-btn ativo" onclick="alternarAba('historico')">📋 Histórico de Empréstimos</button>
        <button class="tab-btn" onclick="alternarAba('funcionarios')">👤 Aba Funcionários (<span id="totalFuncionarios">0</span>)</button>
    </div>

    <!-- Conteúdo da Aba 1: Histórico -->
    <div id="abaHistorico" class="tab-content ativo card table-container">
        <table id="tabelaRegistros">
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Funcionário</th>
                    <th>Ferramenta(s)</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        
        <div class="acoes-finais">
            <button id="btnExportar" onclick="exportarTabela()">Baixar Relatório em CSV</button>
            <button id="btnLimpar" onclick="limparBancoDados()">Limpar Tudo</button>
        </div>
    </div>

    <!-- Conteúdo da Aba 2: Funcionários -->
    <div id="abaFuncionarios" class="tab-content card table-container">
        <table id="tabelaFuncionarios">
            <thead>
                <tr>
                    <th>Nome do Funcionário</th>
                    <th>Total de Retiradas</th>
                    <th>Ferramentas com Ele Agora</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // 1. SISTEMA DE BANCO DE DADOS (LOCALSTORAGE)
        // ==========================================
        
        // Puxa os dados salvos no navegador ou cria vazios se for a primeira vez
        let funcionariosCadastrados = JSON.parse(localStorage.getItem('agil_funcionarios')) || {};
        let historicoEmprestimos = JSON.parse(localStorage.getItem('agil_historico')) || [];

        // Função que salva tudo no navegador
        function salvarNoBancoDeDados() {
            localStorage.setItem('agil_funcionarios', JSON.stringify(funcionariosCadastrados));
            localStorage.setItem('agil_historico', JSON.stringify(historicoEmprestimos));
        }

        // ==========================================
        // 2. INTERFACE E NAVEGAÇÃO
        // ==========================================

        function alternarAba(nomeAba) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('ativo'));
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('ativo'));

            if (nomeAba === 'historico') {
                document.querySelectorAll('.tab-btn')[0].classList.add('ativo');
                document.getElementById('abaHistorico').classList.add('ativo');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('ativo');
                document.getElementById('abaFuncionarios').classList.add('ativo');
            }
        }

        // ==========================================
        // 3. RECONHECIMENTO DE VOZ
        // ==========================================

        const btnGravar = document.getElementById('btnGravar');
        const statusTexto = document.getElementById('statusTexto');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusTexto.innerText = "Navegador não suporta reconhecimento de voz.";
            btnGravar.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;

            btnGravar.addEventListener('click', () => {
                recognition.start();
                btnGravar.classList.add('gravando');
                btnGravar.innerText = "Ouvindo...";
                statusTexto.innerText = "Diga quem pegou o quê...";
            });

            recognition.onresult = (event) => {
                const frase = event.results[0][0].transcript;
                statusTexto.innerText = `Você disse: "${frase}"`;
                processarAudio(frase);
            };

            recognition.onspeechend = () => {
                recognition.stop();
                btnGravar.classList.remove('gravando');
                btnGravar.innerText = "🎙️ Tocar para Falar";
            };

            recognition.onerror = (event) => {
                statusTexto.innerText = "Erro ao ouvir. Tente novamente.";
                btnGravar.classList.remove('gravando');
                btnGravar.innerText = "🎙️ Tocar para Falar";
            };
        }

        // ==========================================
        // 4. LÓGICA DE PROCESSAMENTO
        // ==========================================

        function processarAudio(frase) {
            frase = frase.trim();
            const regexVerbos = /\b(pegou|retirou|levou|solicitou|pediu|pega|esta com|está com)\b/i;
            const match = frase.match(regexVerbos);

            let nome = "";
            let ferramenta = "";

            if (match) {
                const verbIndex = match.index;
                const verbLength = match[0].length;
                nome = frase.substring(0, verbIndex).trim();
                ferramenta = frase.substring(verbIndex + verbLength).trim();
            } else {
                const palavras = frase.split(/\s+/);
                nome = palavras[0];
                ferramenta = palavras.slice(1).join(" ");
            }

            ferramenta = ferramenta.replace(/^(uma|um|o|a|os|as|de|do|da)\s+/i, "").trim();

            nome = capitalizar(nome) || "Não identificado";
            ferramenta = capitalizar(ferramenta) || "Ferramenta não identificada";

            // Cria um ID único para esse empréstimo
            const idEmprestimo = Date.now().toString();
            const agora = new Date();
            const dataHora = `${agora.toLocaleDateString('pt-BR')} ${agora.toLocaleTimeString('pt-BR').substring(0, 5)}`;

            // 1. Atualiza Funcionario
            registrarFuncionario(nome, ferramenta);

            // 2. Adiciona no Histórico Array
            historicoEmprestimos.unshift({
                id: idEmprestimo,
                dataHora: dataHora,
                nome: nome,
                ferramenta: ferramenta,
                status: 'em uso',
                horaDevolucao: null
            });

            // 3. Salva e Renderiza
            salvarNoBancoDeDados();
            renderizarTelas();
        }

        function capitalizar(texto) {
            if (!texto) return "";
            return texto.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function registrarFuncionario(nome, ferramenta) {
            const chaveNome = nome.toLowerCase();
            if (!funcionariosCadastrados[chaveNome]) {
                funcionariosCadastrados[chaveNome] = {
                    nomeOriginal: nome,
                    totalRetiradas: 0,
                    ferramentasEmUso: []
                };
            }
            funcionariosCadastrados[chaveNome].totalRetiradas += 1;
            funcionariosCadastrados[chaveNome].ferramentasEmUso.push(ferramenta);
        }

        // ==========================================
        // 5. RENDERIZAÇÃO E BAIXAS
        // ==========================================

        function renderizarTelas() {
            const tabelaHistorico = document.getElementById('tabelaRegistros').getElementsByTagName('tbody')[0];
            const tabelaFuncionarios = document.getElementById('tabelaFuncionarios').getElementsByTagName('tbody')[0];
            
            // Limpa as tabelas para recriar com os dados do banco
            tabelaHistorico.innerHTML = "";
            tabelaFuncionarios.innerHTML = "";

            // Renderiza Histórico
            historicoEmprestimos.forEach(item => {
                const linha = tabelaHistorico.insertRow();
                
                if (item.status === 'devolvido') {
                    linha.classList.add('linha-baixa');
                }

                linha.insertCell(0).innerText = item.dataHora;
                linha.insertCell(1).innerText = item.nome;
                linha.insertCell(2).innerText = item.ferramenta;
                
                const celulaStatus = linha.insertCell(3);
                if (item.status === 'em uso') {
                    celulaStatus.innerHTML = '<span class="status-badge status-em-uso">Em uso</span>';
                } else {
                    celulaStatus.innerHTML = `<span class="status-badge status-devolvido">Devolvido às ${item.horaDevolucao}</span>`;
                }
                
                const celulaAcao = linha.insertCell(4);
                if (item.status === 'em uso') {
                    celulaAcao.innerHTML = `<button class="btn-baixa" onclick="darBaixa('${item.id}', '${item.nome.toLowerCase()}', '${item.ferramenta}')">Devolver</button>`;
                }
            });

            // Renderiza Funcionários
            const chaves = Object.keys(funcionariosCadastrados);
            document.getElementById('totalFuncionarios').innerText = chaves.length;

            chaves.forEach(chave => {
                const func = funcionariosCadastrados[chave];
                const linha = tabelaFuncionarios.insertRow();
                
                linha.insertCell(0).innerText = func.nomeOriginal;
                linha.insertCell(1).innerText = func.totalRetiradas;
                
                const ferramentasTexto = func.ferramentasEmUso.length > 0 
                    ? func.ferramentasEmUso.join(", ") 
                    : "Nenhuma (Devolvidas)";
                
                linha.insertCell(2).innerText = ferramentasTexto;
            });
        }

        function darBaixa(id, nomeKey, ferramenta) {
            // Atualiza o histórico
            const item = historicoEmprestimos.find(i => i.id === id);
            if (item) {
                const agora = new Date();
                item.status = 'devolvido';
                item.horaDevolucao = agora.toLocaleTimeString('pt-BR').substring(0, 5);
            }

            // Remove a ferramenta da aba de funcionários
            if (funcionariosCadastrados[nomeKey]) {
                const index = funcionariosCadastrados[nomeKey].ferramentasEmUso.indexOf(ferramenta);
                if (index > -1) {
                    funcionariosCadastrados[nomeKey].ferramentasEmUso.splice(index, 1);
                }
            }

            salvarNoBancoDeDados();
            renderizarTelas();
        }

        // ==========================================
        // 6. EXPORTAR E LIMPAR
        // ==========================================

        function exportarTabela() {
            let csv = ['\uFEFF'];
            let linhas = document.querySelectorAll("#tabelaRegistros tr");
            
            for (let i = 0; i < linhas.length; i++) {
                let linha = [];
                let colunas = linhas[i].querySelectorAll("td, th");
                
                for (let j = 0; j < colunas.length - 1; j++) {
                    let texto = colunas[j].innerText.replace(/"/g, '""');
                    linha.push('"' + texto + '"');
                }
                csv.push(linha.join(";"));
            }
            
            let blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            let dataHoje = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
            
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Historico_Emprestimos_${dataHoje}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function limparBancoDados() {
            if(confirm("ATENÇÃO: Tem certeza que deseja apagar TODOS os registros? Isso não pode ser desfeito!")) {
                localStorage.removeItem('agil_funcionarios');
                localStorage.removeItem('agil_historico');
                funcionariosCadastrados = {};
                historicoEmprestimos = [];
                renderizarTelas();
                alert("Banco de dados limpo com sucesso!");
            }
        }

        // Ao abrir a página pela primeira vez, renderiza o que está salvo no banco
        window.onload = renderizarTelas;

    </script>
</body>
</html>
